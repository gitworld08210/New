<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ParallaxAI — Your Personal AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root{--bg:#0d0d0d;--bg2:#171717;--bg3:#212121;--text:#ececec;--text2:#b4b4b4;--muted:#6b6b6b;--border:#2f2f2f;--accent:#10a37f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.header{padding:16px;border-bottom:1px solid var(--border);text-align:center}
.header h1{font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.welcome{text-align:center;padding:60px 20px}
.welcome h2{font-size:26px;margin:16px 0}
.welcome p{color:var(--text2);margin-bottom:24px;font-size:15px}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:420px;margin:0 auto}
.sug{padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s;text-align:left}
.sug:hover{background:var(--bg3);color:var(--text);border-color:var(--accent)}
.msg{margin:12px 0;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row{display:flex;gap:12px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.user .av{background:#5436da}
.msg.bot .av{background:var(--accent)}
.msg-text{line-height:1.6;font-size:15px;padding-top:5px;word-wrap:break-word;flex:1}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;display:inline-block;animation:b 1.4s infinite;margin-right:4px}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{padding:16px;background:var(--bg)}
.input-box{max-width:800px;margin:0 auto;display:flex;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:12px 16px;align-items:center;transition:border-color .2s}
.input-box:focus-within{border-color:var(--muted)}
.input-box textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;max-height:120px;line-height:1.5}
.input-box textarea::placeholder{color:var(--muted)}
.send{width:36px;height:36px;border-radius:50%;border:none;background:#676767;color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.send:hover{background:var(--text)}
.footer{text-align:center;font-size:11px;color:var(--muted);padding:10px}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){.suggestions{grid-template-columns:1fr}.welcome h2{font-size:22px}}
</style>
</head>
<body>
<div class="header"><h1>🤖 ParallaxAI</h1></div>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<div style="font-size:56px;margin-bottom:8px">🤖</div>
<h2>ParallaxAI</h2>
<p>Tumhara Apna AI Dost — Kuch bhi pucho!</p>
<div class="suggestions">
<div class="sug" onclick="send('Hi! Kaise ho?')">👋 Hi! Kaise ho?</div>
<div class="sug" onclick="send('Bore ho raha hoon')">😴 Bore ho raha hoon</div>
<div class="sug" onclick="send('Joke sunao')">😂 Joke sunao</div>
<div class="sug" onclick="send('Movie suggest karo')">🎬 Movie suggest karo</div>
</div>
</div>
</div>
<div class="input-area"><div class="input-box">
<textarea id="inp" placeholder="Message ParallaxAI..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
<button class="send" onclick="send()">&#9654;</button>
</div></div>
<div class="footer">Powered by <a href="https://parallaxai.in">ParallaxAI</a> 🤖</div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),welcome=document.getElementById('welcome');
let busy=false;
function send(t){
if(busy)return;const m=t||inp.value.trim();if(!m)return;
welcome.style.display='none';addMsg('user',m);inp.value='';inp.style.height='auto';busy=true;
const ty=addTyping();
fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})})
.then(r=>r.json()).then(d=>{ty.remove();streamMsg(d.reply)})
.catch(()=>{ty.remove();addMsg('bot','Oops! Error aa gayi. Phir se try karo.');busy=false})}
function addMsg(type,text){const d=document.createElement('div');d.className='msg '+type;
d.innerHTML='<div class="msg-row"><div class="av">'+(type==='user'?'👤':'🤖')+'</div><div class="msg-text">'+text+'</div></div>';
chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function addTyping(){const d=document.createElement('div');d.className='msg bot';
d.innerHTML='<div class="msg-row"><div class="av">🤖</div><div class="msg-text"><div class="typing"><span></span><span></span><span></span></div></div></div>';
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function streamMsg(text){const d=document.createElement('div');d.className='msg bot';
d.innerHTML='<div class="msg-row"><div class="av">🤖</div><div class="msg-text"></div></div>';
chat.appendChild(d);const el=d.querySelector('.msg-text');
for(let i=0;i<text.length;i++){el.textContent+=text[i];chat.scrollTop=chat.scrollHeight;await new Promise(r=>setTimeout(r,20))}
busy=false}
</script>
</body>
</html>
